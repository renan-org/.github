# GitHub Issue Template Configuration
# 
# This file MUST be located at: .github/ISSUE_TEMPLATE/config.yml
# 
# For organization-level configs (like this repo), the relative path is:
#   .github/ISSUE_TEMPLATE/config.yml
# 
# This configures the issue template chooser for all repositories in the organization.
# See README.md for more details about repository structure.

blank_issues_enabled: false # Disables blank/freeform issues: Users cannot create issues without using a predefined template
contact_links: [] # The empty array means no alternative contact methods are provided
